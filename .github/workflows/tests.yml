name: Pruebas

# El esquema usa columnas generadas, ENUM y triggers de MySQL que SQLite no
# reproduce (ver README, sección «Pruebas»), así que este workflow arma una
# base MySQL real en vez de usar la base de datos en memoria más simple.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ventas123
        # Mismo puerto que sistema-restaurante/phpunit.xml (DB_PORT=13311): así el
        # workflow no necesita pisar esa configuración para correr aquí.
        ports:
          - 13311:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pventas123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, gd, bcmath, zip
          coverage: none

      - name: Dependencias de Composer
        working-directory: sistema-restaurante
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # El layout llama a @vite(...) en cada página: sin el manifest, cualquier
      # prueba que renderice una vista real revienta con 500 (Vite manifest
      # not found), aunque la prueba en sí no tenga nada que ver con el front.
      - name: Compilar assets
        working-directory: sistema-restaurante
        run: |
          npm ci
          npm run build

      - name: Clave de aplicación
        working-directory: sistema-restaurante
        # phpunit.xml fuerza casi todo lo demás (ver DB_* con force="true"),
        # pero no trae APP_KEY: sin este paso, Laravel arranca sin clave de
        # cifrado y las pruebas HTTP (sesión, cookies firmadas) fallan.
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Cargar el esquema en ventas_db_test
        run: |
          sed 's/ventas_db/ventas_db_test/g' docs/sql/01_schema_mysql.sql | \
            mysql --host=127.0.0.1 --port=13311 --default-character-set=utf8mb4 -uroot -pventas123
          sed 's/ventas_db/ventas_db_test/g' docs/sql/02_datos_iniciales.sql | \
            mysql --host=127.0.0.1 --port=13311 --default-character-set=utf8mb4 -uroot -pventas123

      - name: Pruebas
        working-directory: sistema-restaurante
        run: php artisan test

      # La misma batería, pero contra una base a la que se le QUITARON los
      # procedimientos, los triggers Y LAS VISTAS, con LOGICA_EN_PHP=true: así
      # corre la demo en hosting compartido, donde no se puede crear ninguna de
      # las tres cosas (ver config/restaurante.php y app/Services/ReglasEnPhp.php).
      # InfinityFree deniega hasta `CREATE VIEW`, con el error 1142.
      #
      # Se borran de `ventas_db_test` en lugar de usar otra base porque
      # phpunit.xml fuerza `DB_DATABASE` con force="true": apuntar a otro
      # nombre desde el entorno es pelearse con esa precedencia, y este camino
      # no deja lugar a dudas sobre contra qué base se corrió.
      # Sin comillas invertidas alrededor de los nombres: son identificadores
      # simples (sp_*, trg_*) y escaparlas a través de YAML, shell y mysql es
      # una fuente de errores que no aporta nada.
      - name: Quitar procedimientos, triggers y vistas
        run: |
          MYSQL="mysql --host=127.0.0.1 --port=13311 --default-character-set=utf8mb4 -uroot -pventas123"
          $MYSQL -N -e "SELECT CONCAT('DROP PROCEDURE IF EXISTS ', ROUTINE_NAME, ';') FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA='ventas_db_test';" > /tmp/quitar.sql
          $MYSQL -N -e "SELECT CONCAT('DROP TRIGGER IF EXISTS ', TRIGGER_NAME, ';') FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='ventas_db_test';" >> /tmp/quitar.sql
          $MYSQL -N -e "SELECT CONCAT('DROP VIEW IF EXISTS ', TABLE_NAME, ';') FROM information_schema.VIEWS WHERE TABLE_SCHEMA='ventas_db_test';" >> /tmp/quitar.sql
          $MYSQL ventas_db_test < /tmp/quitar.sql
          echo "quedan $($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.ROUTINES WHERE ROUTINE_SCHEMA='ventas_db_test';") procedimientos, $($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA='ventas_db_test';") triggers y $($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.VIEWS WHERE TABLE_SCHEMA='ventas_db_test';") vistas"

      - name: Pruebas con la lógica en PHP
        working-directory: sistema-restaurante
        env:
          LOGICA_EN_PHP: 'true'
        run: php artisan test

  # Lo que hace docker-compose.prod.yml al crear la base de un cliente nuevo:
  # esquema, datos base (NO los de demostración) y la cuenta ventas_app. Las
  # pruebas corren con los datos de demostración, así que un error en estos
  # archivos solo aparecía el día de instalar.
  instalacion:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ventas123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pventas123"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Esquema y datos base de producción
        run: |
          MYSQL="mysql --host=127.0.0.1 --port=3306 --default-character-set=utf8mb4 -uroot -pventas123"
          $MYSQL < docs/sql/01_schema_mysql.sql
          $MYSQL < docs/sql/produccion/02_datos_base.sql

      # El script está escrito para el contenedor de MySQL (socket local): aquí
      # se le cambia `mysql` por una función que va por TCP al servicio.
      - name: Cuenta ventas_app
        env:
          MYSQL_ROOT_PASSWORD: ventas123
          DB_APP_PASSWORD: clave-de-prueba-ci
        run: |
          mysql() {
            local a=()
            for x in "$@"; do [ "$x" = "--protocol=socket" ] || a+=("$x"); done
            command mysql --host=127.0.0.1 --port=3306 "${a[@]}"
          }
          export -f mysql
          bash docs/sql/produccion/03_usuario_app.sh | tee /tmp/usuario.log
          grep -q "Cuenta ventas_app creada" /tmp/usuario.log

      - name: Comprobar la instalación con ventas_app
        run: |
          APP="mysql --host=127.0.0.1 --port=3306 -uventas_app -pclave-de-prueba-ci -N ventas_db"
          test "$($APP -e "SELECT COUNT(*) FROM usuarios u JOIN roles r ON r.id = u.rol_id WHERE r.nombre = 'Administrador'")" -ge 1
          test "$($APP -e "SELECT COUNT(*) FROM permisos")" -gt 0
          test "$($APP -e "SELECT COUNT(*) FROM productos")" -eq 0
          test "$($APP -e "SHOW TABLES LIKE 'parches_aplicados'")" = parches_aplicados
          if $APP -e "DROP TABLE auditoria" 2>/dev/null; then
            echo "ventas_app no debería poder borrar tablas" >&2
            exit 1
          fi

      - name: Imagen de producción
        run: docker build -f sistema-restaurante/Dockerfile.prod -t restaurante-prod sistema-restaurante

  # El hosting compartido corre MariaDB, no MySQL, y ahí la lógica va en PHP
  # (sin procedimientos, triggers ni vistas). Lo único que se mantiene son los
  # CHECK del esquema, que es justo donde se cuelan las funciones que MariaDB no
  # tiene (REGEXP_LIKE). Sin este trabajo, eso solo se descubría al instalar.
  mariadb:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ventas123
        ports:
          - 13311:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, mysql, gd, bcmath, zip
          coverage: none

      - name: Dependencias de Composer
        working-directory: sistema-restaurante
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Compilar assets
        working-directory: sistema-restaurante
        run: |
          npm ci
          npm run build

      - name: Clave de aplicación
        working-directory: sistema-restaurante
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # Sin procedimientos, triggers ni vistas: lo que MariaDB no deja crear en
      # el hosting. El esquema tiene que entrar igual.
      - name: Cargar el esquema en MariaDB, sin lo que el hosting no permite
        run: |
          MYSQL="mysql --host=127.0.0.1 --port=13311 --default-character-set=utf8mb4 -uroot -pventas123"
          python3 scripts/esquema-sin-logica.py docs/sql/01_schema_mysql.sql \
            | sed 's/ventas_db/ventas_db_test/g' | $MYSQL
          sed 's/ventas_db/ventas_db_test/g' docs/sql/02_datos_iniciales.sql | $MYSQL
          echo "tablas: $($MYSQL -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ventas_db_test'")"

      - name: Pruebas con la lógica en PHP, sobre MariaDB
        working-directory: sistema-restaurante
        env:
          LOGICA_EN_PHP: 'true'
        run: php artisan test

  estilo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Dependencias de Composer
        working-directory: sistema-restaurante
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (estilo de código PHP)
        working-directory: sistema-restaurante
        run: ./vendor/bin/pint --test

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dependencias de npm
        working-directory: sistema-restaurante
        run: npm ci

      - name: ESLint
        working-directory: sistema-restaurante
        run: npm run lint

      - name: Prettier
        working-directory: sistema-restaurante
        run: npm run format
