# nginx como front del php-fpm de Laravel, para PRODUCCIÓN.
#
# Casi idéntico a default.conf (desarrollo). La única diferencia de fondo
# está en cómo se sirven las fotos de producto: en desarrollo, aplicación y
# nginx comparten el MISMO directorio del host por bind mount, así que el
# enlace `public/storage -> ../storage/app/public` que crea
# `artisan storage:link` le sirve a los dos. En producción el código de la
# aplicación vive horneado en su imagen y nginx sigue leyendo `public/` del
# disco del host: son dos sistemas de ficheros distintos, y ese enlace
# apuntaría a un directorio que, del lado de nginx, no existe. Por eso aquí
# `/storage/` se resuelve con un `alias` explícito al volumen compartido,
# sin depender de ningún symlink.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # No hay motivo para anunciar la versión de nginx en los headers y en las
    # páginas de error propias: es información gratis para quien busque un
    # exploit conocido de esa versión.
    server_tokens off;

    # A nivel de servidor para que cubra también las páginas que arma Laravel,
    # y repetido con `include` en cada bloque que ponga cabeceras propias: en
    # nginx un `add_header` dentro de un `location` descarta los heredados.
    include /etc/nginx/conf.d/seguridad.conf;

    # Las fotos de producto pueden venir de un móvil.
    client_max_body_size 20M;

    # Logs a stdout/stderr para que los recoja `docker compose logs`.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Fotos de producto: el volumen `ventas_storage` montado en solo lectura
    # (ver docker-compose.prod.yml). Va antes que el bloque de estáticos por
    # extensión para que gane sobre él.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/seguridad.conf;
        access_log off;
        try_files $uri =404;
    }

    # Enrutado de Laravel: si no existe el fichero, va al front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets versionados por Vite: llevan hash en el nombre, se pueden cachear
    # sin riesgo de servir una versión vieja.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/seguridad.conf;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        include /etc/nginx/conf.d/seguridad.conf;
        access_log off;

        # Sin `=404`: esta regex captura cualquier URL acabada en .js o .css, y
        # algunas las sirve la aplicación en vez de existir como fichero. Si no
        # hay fichero se delega en Laravel.
        try_files $uri @laravel;
    }

    location ~ \.php$ {
        # app:9000 -> nombre del servicio php-fpm en la red de compose.
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Corta rutas tipo /imagen.png/malicioso.php antes de llegar a PHP.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $uri =404;
    }

    # Respaldo para los assets que no existen en disco y sirve la aplicación.
    # En bloque propio para que el `expires 30d` de arriba no acabe cacheando
    # una respuesta dinámica.
    location @laravel {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nada fuera de public/ debe ser alcanzable, y los dotfiles tampoco.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml font/woff font/woff2;
}
