# Cabeceras de seguridad, en un archivo aparte a propósito.
#
# En nginx, un `add_header` dentro de un `location` DESCARTA todos los heredados
# del bloque `server`. Los bloques que ponían el suyo —/storage/ (las fotos que
# suben los usuarios), /build/ y los estáticos— se quedaban sin marco, sin CSP y
# sin HSTS. Por eso las cuatro viven aquí y cada bloque hace `include`.
#
#   X-Frame-Options: nadie puede meter el sistema en un <iframe> ajeno y
#     engañar a alguien con sesión abierta para que haga clic sobre una acción
#     real (anular una venta, borrar un cliente) sin darse cuenta.
#   X-Content-Type-Options: el navegador no reinterpreta la respuesta como un
#     tipo distinto del que dice el Content-Type.
#   Strict-Transport-Security: quien ya entró por https no vuelve a intentar
#     http. Por http plano los navegadores lo ignoran, así que no rompe un
#     local sin certificado.
#   Content-Security-Policy: solo lo que no depende de los scripts de la página
#     (Alpine necesita eval): nadie la enmarca, no se cambia la base de las
#     URLs, los formularios solo envían a este mismo sitio, sin plugins.
#   Referrer-Policy: las direcciones internas no se filtran a otros sitios.

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Referrer-Policy "same-origin" always;
