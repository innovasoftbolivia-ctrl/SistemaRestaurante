# =============================================================================
#  Sistema de Venta de Productos - Docker Compose de PRODUCCIÓN
#
#  Fichero aparte y completo, no un `override` de docker-compose.yml: la
#  diferencia principal con desarrollo es un bind mount que aquí NO debe
#  existir (el código va horneado en la imagen), y un override de compose
#  solo sabe añadir montajes, nunca quitarlos. Dos ficheros separados evitan
#  esa trampa y además dejan a la vista, de un vistazo, qué corre en el
#  servidor de un cliente y qué no.
#
#      npm ci && npm run build                                  (en sistema-restaurante/, antes)
#      docker compose -f docker-compose.prod.yml up -d --build   levanta todo
#      docker compose -f docker-compose.prod.yml logs -f app     sigue los logs
#      docker compose -f docker-compose.prod.yml down            detiene, conservando los datos
#
#  Aplicación -> http://localhost:8100  (ponle un proxy con HTTPS delante si
#  el servidor es accesible desde internet — ver README, «Nueva instalación»)
#
#  Diferencias con docker-compose.yml (desarrollo):
#    - Imagen de producción (Dockerfile.prod): código y dependencias dentro
#      de la imagen, sin bind mount, corriendo como usuario sin privilegios.
#    - MySQL sin puerto publicado: nada fuera de la red de Docker necesita
#      llegar directo a la base. Para entrar con Workbench/DBeaver desde otra
#      máquina se usa un túnel SSH al servidor, no un puerto abierto.
#    - Sin Vite (no hay hot-reload que servir) y sin Adminer (un cliente de
#      base de datos sin autenticación propia no pinta nada en un servidor).
#    - La contraseña de la base es obligatoria: aquí no hay valor por defecto
#      que permita arrancar «de prueba» con una contraseña conocida.
# =============================================================================

name: restaurante-prod

services:
  # ---------------------------------------------------------------------------
  # Aplicación: php-fpm con el código horneado en la imagen
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./sistema-restaurante
      dockerfile: Dockerfile.prod
    # Nombre fijo para que el programador de tareas use la MISMA imagen.
    image: restaurante-app:prod
    container_name: restaurante_app_prod
    restart: unless-stopped
    # Los logs de Docker con tope: sin esto nginx y el programador escriben
    # cada minuto hasta llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: ./sistema-restaurante/.env.docker
    volumes:
      # Solo lo que tiene que sobrevivir a reconstruir la imagen: las fotos
      # que suben los usuarios y los logs. El código NO se monta — vive en la
      # imagen, y esa es justamente la garantía de que lo que corre es lo que
      # se construyó.
      - restaurante_storage:/var/www/html/storage/app/public
      - restaurante_logs:/var/www/html/storage/logs
      # Los respaldos, en un volumen: dentro de la imagen se perderían al
      # reconstruirla, que es justo cuando más falta pueden hacer.
      - restaurante_respaldos:/var/www/html/storage/app/respaldos
      # La copia externa de los respaldos: una carpeta del SERVIDOR (disco USB,
      # carpeta sincronizada, unidad de red) montada donde la busca
      # RESPALDOS_COPIA=/respaldos-copia. Sin montaje, la copia se quedaba
      # dentro del contenedor y se perdía al recrearlo.
      - ${RESPALDOS_COPIA_SERVIDOR:-./respaldos-copia}:/respaldos-copia
      # La conexión con Google Drive (scripts/conectar-drive.sh). En un volumen
      # y no en la imagen: rclone la reescribe al renovar el permiso, y
      # reconstruir la imagen no tiene que desconectar Drive.
      - restaurante_rclone:/var/www/html/storage/app/rclone
    environment:
      RCLONE_CONFIG: /var/www/html/storage/app/rclone/rclone.conf
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # "Sano" = php-fpm acepta conexiones en el 9000. Se prueba el socket con
      # el propio PHP y no con pgrep o nc: php-fpm reescribe su título de
      # proceso y el nc de busybox no siempre trae -z.
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Programador de tareas: el respaldo de todas las noches (routes/console.php)
  # ---------------------------------------------------------------------------
  # Misma imagen y mismos volúmenes que la aplicación, con otro proceso. Sin
  # esto `respaldo:crear` existe pero nadie lo corre: el script de respaldo
  # que había también decía «pensado para cron» y nadie lo había agendado.
  # Arranca cuando la aplicación está sana, así no siembran credenciales los
  # dos contenedores a la vez.
  programador:
    image: restaurante-app:prod
    pull_policy: never
    container_name: restaurante_programador_prod
    restart: unless-stopped
    # Los logs de Docker con tope: sin esto nginx y el programador escriben
    # cada minuto hasta llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file: ./sistema-restaurante/.env.docker
    command: ["su-exec", "www-data", "php", "artisan", "schedule:work"]
    volumes:
      - restaurante_storage:/var/www/html/storage/app/public
      - restaurante_logs:/var/www/html/storage/logs
      - restaurante_respaldos:/var/www/html/storage/app/respaldos
      - ${RESPALDOS_COPIA_SERVIDOR:-./respaldos-copia}:/respaldos-copia
      - restaurante_rclone:/var/www/html/storage/app/rclone
    environment:
      RCLONE_CONFIG: /var/www/html/storage/app/rclone/rclone.conf
    depends_on:
      app:
        condition: service_healthy
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Servidor web
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: restaurante_nginx_prod
    restart: unless-stopped
    # Los logs de Docker con tope: sin esto nginx y el programador escriben
    # cada minuto hasta llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # En el local, las cajas entran por la red: http://IP-del-servidor:8100.
      # Con un proxy HTTPS en el mismo servidor, ponlo en 127.0.0.1:8100 (en el
      # .env de esta carpeta) para que nadie entre saltándose el HTTPS.
      - "${APP_PUERTO:-8100}:80"
    volumes:
      - ./sistema-restaurante/docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Las cabeceras de seguridad, que cada bloque incluye (ver seguridad.conf).
      - ./sistema-restaurante/docker/nginx/seguridad.conf:/etc/nginx/conf.d/seguridad.conf:ro
      # Estáticos servidos directo desde el disco del servidor, sin pasar por
      # PHP. Es el mismo checkout desde el que se construyó la imagen, así que
      # `public/build/` (generado antes con `npm run build`) coincide con el
      # manifest que la aplicación lee por dentro.
      - ./sistema-restaurante/public:/var/www/html/public:ro
      # Y las fotos de producto, del volumen compartido con la aplicación.
      # En solo lectura: nginx las sirve, no las escribe.
      - restaurante_storage:/var/www/html/storage/app/public:ro
    depends_on:
      # `service_healthy` y no la forma corta: nginx resuelve `app` una sola
      # vez, al cargar la configuración, y si en ese instante el contenedor
      # todavía no está en el DNS de la red se cae con «host not found in
      # upstream». Esperar a que php-fpm acepte conexiones evita ese ciclo de
      # reinicios en un arranque en frío o tras reconstruir la imagen.
      app:
        condition: service_healthy
    healthcheck:
      # /up es el endpoint de salud de bootstrap/app.php: valida la cadena
      # completa (nginx -> php-fpm -> Laravel), no solo que el proceso viva.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Base de datos
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: restaurante_mysql_prod
    restart: unless-stopped
    # Los logs de Docker con tope: sin esto nginx y el programador escriben
    # cada minuto hasta llenar el disco.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      # Sin valor por defecto, a propósito: en desarrollo se cae en
      # "ventas123" para no romper una instalación que ya existía sin `.env`,
      # pero un servidor real tiene que traer su propia contraseña o no
      # arrancar. Sale de `.env` en esta misma carpeta (ver .env.example).
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?falta DB_PASSWORD — copia .env.example a .env y ponle una contraseña propia}"
      # La de `ventas_app`, la cuenta con permisos mínimos de la aplicación
      # (docs/sql/produccion/03_usuario_app.sh). Vacía, no se crea.
      DB_APP_PASSWORD: "${DB_APP_PASSWORD:-}"
      TZ: America/La_Paz
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=-04:00
      --explicit_defaults_for_timestamp=OFF
    volumes:
      - restaurante_data:/var/lib/mysql
      # Al primer arranque el contenedor ejecuta estos scripts en orden
      # alfabético: el esquema y los datos BASE de producción. No el
      # 02_datos_iniciales.sql de desarrollo, que trae el negocio de
      # demostración (productos, clientes y empleados de ejemplo).
      - ./docs/sql/01_schema_mysql.sql:/docker-entrypoint-initdb.d/01_schema_mysql.sql:ro
      - ./docs/sql/produccion/02_datos_base.sql:/docker-entrypoint-initdb.d/02_datos_base.sql:ro
      - ./docs/sql/produccion/03_usuario_app.sh:/docker-entrypoint-initdb.d/03_usuario_app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [restaurante]

volumes:
  restaurante_data:
  restaurante_storage:
  restaurante_logs:
  restaurante_respaldos:
  restaurante_rclone:

networks:
  restaurante:
    driver: bridge
