# nginx como front del php-fpm de Laravel, para el entorno de desarrollo.
# public/ llega por bind mount desde el host.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # No hay motivo para anunciar la versión de nginx en los headers y en las
    # páginas de error propias: es información gratis para quien busque un
    # exploit conocido de esa versión.
    server_tokens off;

    # A nivel de servidor para que cubra también las páginas que arma Laravel
    # (los bloques de estáticos más abajo ya traían el segundo, por su cuenta).
    #   X-Frame-Options: nadie puede meter el sistema en un <iframe> ajeno y
    #     engañar a un usuario con sesión iniciada para que haga clic sobre una
    #     acción real (anular una venta, eliminar un cliente) sin darse cuenta.
    #   X-Content-Type-Options: el navegador no reinterpreta la respuesta como
    #     un tipo distinto al que dice el Content-Type.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Las fotos de producto pueden venir de un móvil.
    client_max_body_size 20M;

    # Logs a stdout/stderr para que los recoja `docker compose logs`.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Fotos de producto. Por `alias` explícito y no por el enlace
    # `public/storage` que crea `artisan storage:link`: ese enlace es
    # absoluto (apunta a /var/www/html/storage/app/public) y nginx solo tiene
    # montado `public/`, así que del lado de nginx no lleva a ninguna parte y
    # toda foto respondía 403. El directorio se monta aparte en
    # docker-compose.yml. Mismo criterio que en default.prod.conf, para que
    # las fotos se sirvan igual en los dos entornos.
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Enrutado de Laravel: si no existe el fichero, va al front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets versionados por Vite: llevan hash en el nombre, se pueden cachear
    # sin riesgo de servir una versión vieja.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;

        # Sin `=404`: esta regex captura cualquier URL acabada en .js o .css, y
        # algunas las sirve la aplicación en vez de existir como fichero. Si no
        # hay fichero se delega en Laravel.
        try_files $uri @laravel;
    }

    location ~ \.php$ {
        # app:9000 -> nombre del servicio php-fpm en la red de compose.
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Corta rutas tipo /imagen.png/malicioso.php antes de llegar a PHP.
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $uri =404;
    }

    # Respaldo para los assets que no existen en disco y sirve la aplicación.
    # En bloque propio para que el `expires 30d` de arriba no acabe cacheando
    # una respuesta dinámica.
    location @laravel {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nada fuera de public/ debe ser alcanzable, y los dotfiles tampoco.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               image/svg+xml font/woff font/woff2;
}
