; Ajustes de PHP para el entorno de PRODUCCIÓN del Sistema de Restaurante.
; Ver docker/php/php.dev.ini para la versión de desarrollo — los límites de
; subida y el resto de valores neutros se mantienen iguales a propósito.

; Las fotos de producto se suben desde el formulario; 2M (el valor por
; defecto) se queda corto para una foto de móvil.
upload_max_filesize = 16M
post_max_size = 20M

memory_limit = 512M
max_execution_time = 120

; En producción el error nunca se le muestra a quien esté usando el
; sistema (Laravel ya lo controla con APP_DEBUG=false y su propia página de
; error), pero además se apaga aquí, en PHP: doble candado, para que ni una
; extensión ni un error antes de que Laravel arranque impriman una traza con
; rutas del servidor o nombres de variables.
display_errors = Off
display_startup_errors = Off
log_errors = On
; Sin `error_log` explícito a propósito: php-fpm ya manda los suyos a stderr
; (lo trae la imagen oficial en php-fpm.d/docker.conf), y los de artisan
; salen por stderr del propio proceso. Apuntar `/proc/self/fd/2` desde aquí
; se lo aplicaría también a procesos que no corren como root, y reabrir ese
; descriptor —que pertenece a root— les da «Permission denied».

; La versión de PHP no tiene por qué anunciarse en cada respuesta
; (header `X-Powered-By`): es información gratis para quien busque un
; exploit conocido de esa versión.
expose_php = Off

; El código está horneado en la imagen (a diferencia de desarrollo, donde
; llega por bind mount): el timestamp de un fichero no va a cambiar nunca
; mientras el contenedor viva, así que OPcache no necesita comprobarlo en
; cada petición. Es la ganancia de rendimiento real de una imagen inmutable
; — sin esto, PHP repetiría en cada request un `stat()` por cada fichero que
; nunca va a haber cambiado. Un cambio de código real llega con una imagen
; nueva y un contenedor recreado, no editando un fichero en caliente.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

date.timezone = America/La_Paz
