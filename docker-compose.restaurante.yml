# =============================================================================
#  Sistema de Restaurante - Docker Compose (desarrollo)
#
#  Stack APARTE del de `docker-compose.yml` (proyecto `ventas-dev`): otros
#  contenedores, otros puertos y —lo importante— su propio volumen de datos.
#  Los dos pueden coexistir, y levantar este no toca ni borra la base del otro.
#
#      docker compose -f docker-compose.restaurante.yml up -d --build
#      docker compose -f docker-compose.restaurante.yml logs -f app
#      docker compose -f docker-compose.restaurante.yml down       conserva los datos
#      docker compose -f docker-compose.restaurante.yml down -v     BORRA los datos
#
#  Aplicación -> http://localhost:8200
#  Adminer    -> http://localhost:8201   (solo con --profile tools)
#  MySQL      -> 127.0.0.1:13311  usuario root, base ventas_db  (solo desde esta máquina)
#  Vite HMR   -> puerto 5175, lo consume el navegador solo (no se abre a mano)
#
#  Los puertos van en el rango 82xx para no chocar con los demás proyectos del
#  repositorio: 8000 (granja), 8080 y 8081 (Aerolínea), 8090 (asistencia),
#  8100 y 8101 (ventas), 8700 (granja-perm).
#
#  El nombre de la base se queda en `ventas_db` a propósito: es el que usan
#  `docs/sql/*`, los scripts y los tests, y cambiarlo obligaría a tocar todos
#  ellos sin ganar nada —esta base vive en su propio contenedor, así que el
#  nombre no choca con el del otro stack—.
#
#  Comparte el mismo `sistema-ventas/.env.docker` que el otro stack; lo único
#  que se pisa aquí es APP_URL (el puerto es distinto) y el puerto de Vite.
# =============================================================================

name: restaurante-dev

services:
  # ---------------------------------------------------------------------------
  # Aplicación: php-fpm con el código montado desde el host
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ./sistema-ventas
    container_name: restaurante_app
    restart: unless-stopped
    env_file: ./sistema-ventas/.env.docker
    environment:
      # El .env.docker apunta al 8100 (el otro stack). Aquí manda este.
      APP_URL: http://localhost:8200
      # La conexión con Google Drive de los respaldos, si se prueba en
      # desarrollo (scripts/conectar-drive.sh). storage/app no va a git.
      RCLONE_CONFIG: /var/www/html/storage/app/rclone/rclone.conf
    volumes:
      - ./sistema-ventas:/var/www/html
      # vendor/ en un volumen y NO en el bind mount: el del host se instaló
      # desde Windows y trae rutas y binarios que no valen en Linux. Volumen
      # propio de este stack, para no pelearse con el de `ventas-dev`.
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f vendor/autoload.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Servidor web
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: restaurante_nginx
    restart: unless-stopped
    ports:
      - "8200:80"
    volumes:
      - ./sistema-ventas/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sistema-ventas/public:/var/www/html/public:ro
      - ./sistema-ventas/storage/app/public:/var/www/html/storage/app/public:ro
    depends_on: [app]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Base de datos: contenedor y volumen propios
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: restaurante_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ventas123}
      TZ: America/La_Paz
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=-04:00
      --explicit_defaults_for_timestamp=OFF
    ports:
      # 13311: el 13310 es del stack de ventas, y por debajo de 13000 Windows
      # reserva rangos que cambian en cada reinicio (ver docker-compose.yml).
      # Publicado solo en 127.0.0.1: no se alcanza desde fuera de esta máquina.
      - "127.0.0.1:13311:3306"
    volumes:
      - restaurante_data:/var/lib/mysql
      # Al PRIMER arranque carga `docs/sql/01_schema_mysql.sql` y
      # `02_datos_iniciales.sql` por orden alfabético (las subcarpetas
      # `parches/` y `produccion/` las ignora el entrypoint de MySQL).
      # Para recargar a mano:
      #   docker exec -i restaurante_mysql mysql --default-character-set=utf8mb4 \
      #     -uroot -p"$DB_PASSWORD" < docs/sql/01_schema_mysql.sql
      - ./docs/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Vite: compilación de assets con hot-reload
  # ---------------------------------------------------------------------------
  vite:
    image: node:22-alpine
    container_name: restaurante_vite
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm ci --ignore-scripts --no-audit --no-fund; npm run dev"
    ports:
      # Mismo puerto dentro y fuera: el navegador pide los assets a
      # localhost:5175, y ese valor es el que `vite.config.js` escribe en
      # `public/hot`. Publicarlo en un puerto distinto del interno rompería el
      # hot-reload, porque el navegador buscaría el 5174 —que es del otro stack—.
      - "5175:5175"
    env_file: ./sistema-ventas/.env.docker
    environment:
      DOCKER: "true"
      # Lo lee vite.config.js. Sin esto escucharía en el 5174, el del otro stack.
      VITE_PUERTO: "5175"
      APP_URL: http://localhost:8200
    volumes:
      - ./sistema-ventas:/var/www/html
      - node-modules:/var/www/html/node_modules
    networks: [restaurante]

  # ---------------------------------------------------------------------------
  # Adminer: explorar la base sin instalar nada. Detrás de un perfil, porque es
  # un cliente sin autenticación propia y no tiene por qué estar escuchando
  # todo el tiempo:
  #
  #   docker compose -f docker-compose.restaurante.yml --profile tools up -d adminer
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:4
    container_name: restaurante_adminer
    restart: unless-stopped
    profiles: [tools]
    ports:
      - "8201:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: dracula
    depends_on:
      mysql:
        condition: service_healthy
    networks: [restaurante]

volumes:
  restaurante_data:
  vendor:
  node-modules:

networks:
  restaurante:
    driver: bridge
